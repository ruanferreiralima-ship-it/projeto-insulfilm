<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUAN FILM - Cadastro</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800;900&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #121212;
            --bg-secondary: #1a1a1a;
            --bg-card: #181818;
            --bg-glass: rgba(26, 26, 26, 0.85);
            --text-primary: #f5f5f5;
            --text-secondary: #b0b0b0;
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-dark: #AA7C11;
            --border-gold: rgba(212, 175, 55, 0.35);
            --border-gold-solid: #D4AF37;
            --shadow-gold: 0 4px 20px rgba(212, 175, 55, 0.15);
            --font-scale: 1rem;
            --card-border-radius: 14px;
        }

        [data-theme="light"] {
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.95);
            --text-primary: #111111;
            --text-secondary: #4a4a4a;
            --gold-primary: #8a6800;
            --gold-light: #b38800;
            --gold-dark: #5c4500;
            --border-gold: rgba(138, 104, 0, 0.5);
            --border-gold-solid: #8a6800;
            --shadow-gold: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        html {
            font-size: var(--font-scale);
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFF 0%, var(--gold-primary) 50%, var(--gold-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-text {
            color: var(--gold-primary) !important;
        }

        .gold-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: var(--card-border-radius);
            box-shadow: var(--shadow-gold);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-dark) 100%);
            color: #000 !important;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            padding: 0.65rem 1.6rem;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .btn-gold:hover {
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-primary) 100%);
            box-shadow: 0 0 18px rgba(212, 175, 55, 0.5);
            transform: translateY(-2px);
        }

        .btn-outline-gold {
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary) !important;
            background: transparent;
            font-weight: 600;
            border-radius: 8px;
            padding: 0.65rem 1.6rem;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-outline-gold:hover {
            background-color: var(--gold-primary);
            color: #000 !important;
            box-shadow: 0 0 18px rgba(212, 175, 55, 0.35);
        }

        .form-control, .form-select {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-gold);
            color: var(--text-primary);
            border-radius: 8px;
            padding: 0.7rem 1rem;
        }

        .form-control:focus, .form-select:focus {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            border-color: var(--gold-primary);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        .form-label {
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .extra-small {
            font-size: 0.78rem;
        }
    </style>
</head>
<body>

    <main class="container my-auto py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-9 col-xl-8">
                <div class="gold-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h2 class="brand-title h1 mb-1">RUAN INSULFILM</h2>
                        <p class="text-secondary small fw-semibold">Cadastro de Usuário no Sistema</p>
                    </div>

                    <form id="registerForm" novalidate>
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Nome Completo *</label>
                                <input type="text" class="form-control" id="reg-nome" placeholder="Digite seu nome completo">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label">Data de Nascimento *</label>
                                <input type="date" class="form-control" id="reg-nascimento">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label">Sexo *</label>
                                <select class="form-select" id="reg-sexo">
                                    <option value="">Selecione...</option>
                                    <option value="M">Masculino</option>
                                    <option value="F">Feminino</option>
                                    <option value="O">Outro</option>
                                </select>
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label">Nome Materno *</label>
                                <input type="text" class="form-control" id="reg-nome-materno" placeholder="Nome completo da mãe">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label">CPF *</label>
                                <input type="text" class="form-control" id="reg-cpf" placeholder="000.000.000-00">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label">Celular * <span class="gold-text extra-small">(+55)XX-XXXXXXXX</span></label>
                                <input type="text" class="form-control" id="reg-celular" placeholder="(+55)21-999999999">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label">Telefone Fixo * <span class="gold-text extra-small">(+55)XX-XXXXXXXX</span></label>
                                <input type="text" class="form-control" id="reg-fixo" placeholder="(+55)21-22223333">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Endereço Completo *</label>
                                <input type="text" class="form-control" id="reg-endereco" placeholder="Rua, Número, Bairro, Cidade - Estado">
                            </div>
                            <div class="col-12 col-md-4">
                                <label class="form-label">Login * <span class="gold-text extra-small">(6 letras)</span></label>
                                <input type="text" class="form-control" id="reg-login" maxlength="6">
                            </div>
                            <div class="col-12 col-md-4">
                                <label class="form-label">Senha * <span class="gold-text extra-small">(8 letras)</span></label>
                                <input type="password" class="form-control" id="reg-senha" maxlength="8">
                            </div>
                            <div class="col-12 col-md-4">
                                <label class="form-label">Confirma Senha *</label>
                                <input type="password" class="form-control" id="reg-confirma-senha" maxlength="8">
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center gap-3 mt-4 pt-3 border-top border-secondary">
                            <a href="login.html" class="btn btn-outline-gold">Ir para Login</a>
                            <button type="submit" class="btn btn-gold">Cadastrar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
